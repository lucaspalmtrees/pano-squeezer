name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  # Set to 'true' once an Apple Developer account exists and these secrets are configured:
  #   DEVELOPER_ID_CERT_P12 (base64), DEVELOPER_ID_CERT_PASSWORD, DEVELOPER_ID (e.g. "Developer ID Application: Name (TEAMID)"),
  #   APPLE_ID, APPLE_TEAM_ID, APPLE_APP_PASSWORD (app-specific password)
  NOTARIZE: 'false'

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Unit tests
        run: swift test

      - name: Import Developer ID certificate (disabled until NOTARIZE=true)
        if: env.NOTARIZE == 'true'
        env:
          P12: ${{ secrets.DEVELOPER_ID_CERT_P12 }}
          P12_PASSWORD: ${{ secrets.DEVELOPER_ID_CERT_PASSWORD }}
        run: |
          echo "$P12" | base64 --decode > cert.p12
          security create-keychain -p ci build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p ci build.keychain
          security import cert.p12 -k build.keychain -P "$P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k ci build.keychain
          rm cert.p12

      - name: Build app
        env:
          DEVELOPER_ID: ${{ env.NOTARIZE == 'true' && secrets.DEVELOPER_ID || '' }}
        run: scripts/build-app.sh "${GITHUB_REF_NAME#v}"

      - name: Package (zip + dmg)
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          ditto -c -k --keepParent dist/pano-squeezer.app "dist/pano-squeezer-$VERSION.zip"
          mkdir -p dist/dmg && cp -R dist/pano-squeezer.app dist/dmg/ && ln -s /Applications dist/dmg/Applications
          hdiutil create -volname "pano-squeezer" -srcfolder dist/dmg -ov -format UDZO "dist/pano-squeezer-$VERSION.dmg"

      - name: Notarize (disabled until NOTARIZE=true)
        if: env.NOTARIZE == 'true'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          xcrun notarytool submit "dist/pano-squeezer-$VERSION.dmg" --apple-id "$APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD" --wait
          xcrun stapler staple "dist/pano-squeezer-$VERSION.dmg"

      - name: Release notes from CHANGELOG.md
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v v="$VERSION" '
            $0 ~ "^## \\[?" v "\\]?" { found=1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > dist/notes.md
          [ -s dist/notes.md ] || echo "Release $VERSION" > dist/notes.md
          cat dist/notes.md

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" --title "pano-squeezer $VERSION" --notes-file dist/notes.md \
            "dist/pano-squeezer-$VERSION.zip" "dist/pano-squeezer-$VERSION.dmg"
