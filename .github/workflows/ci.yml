name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  linux:
    name: Core tests (Linux)
    runs-on: ubuntu-latest
    container: swift:6.0-noble
    steps:
      - uses: actions/checkout@v4
      - name: Install exiftool
        run: apt-get update -qq && apt-get install -y -qq libimage-exiftool-perl python3 >/dev/null
      - name: Build
        run: swift build
      - name: Unit tests
        run: swift test
      - name: Cache sample DNGs
        uses: actions/cache@v4
        with:
          path: testdata/downloaded
          key: rpu-cc0-samples-${{ hashFiles('scripts/fetch-samples.py') }}
      - name: Fetch CC0 sample DNGs
        run: python3 scripts/fetch-samples.py testdata/downloaded
      - name: Integration test
        run: scripts/integration-test.sh --require-real

  macos:
    name: App build + tests (macOS)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Swift version
        run: swift --version
      - name: Build
        run: swift build
      - name: Unit tests
        run: swift test
      - name: Install exiftool
        run: brew install exiftool
      - name: Cache sample DNGs
        uses: actions/cache@v4
        with:
          path: testdata/downloaded
          key: rpu-cc0-samples-${{ hashFiles('scripts/fetch-samples.py') }}
      - name: Fetch CC0 sample DNGs
        run: python3 scripts/fetch-samples.py testdata/downloaded
      - name: Integration test
        run: scripts/integration-test.sh --require-real
      - name: Build app bundle
        run: scripts/build-app.sh
      - name: Upload app
        uses: actions/upload-artifact@v4
        with:
          name: pano-squeezer-app
          path: dist/pano-squeezer.app
          retention-days: 7
